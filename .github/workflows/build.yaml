name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for actions/checkout
      pull-requests: write # Needed to create PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install black flake8

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          black: true
          flake8: true

      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py
        # working-directory: ./yaml_test 
      - name: Install GitHub CLI Manually
        run: |
          set -x # Enable verbose output for debugging this step
          sudo mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null

          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          
          # Update APT cache
          sudo apt update
          
          # Install GitHub CLI
          sudo apt install gh -y
          
          # Verify installation and version (should be 2.x.x or higher)
          gh --version
          
     - name: Create and Immediately Merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux # Enable verbose output for debugging

          TARGET_BRANCH="dev-branch" # <<<--- Define your target branch here!
          CURRENT_BRANCH="${{ GITHUB_REF##*/ }}" # Get current branch name directly

          echo "Attempting to create/merge PR from $CURRENT_BRANCH to $TARGET_BRANCH"

          # Exit if current branch is the target branch
          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            echo "Current branch ($CURRENT_BRANCH) is the same as the target branch ($TARGET_BRANCH). Skipping PR creation/merge."
            exit 0
          fi

          PR_NUMBER=""

          # Try to create the PR. If it fails (e.g., PR already exists),
          # we'll still try to merge an existing one.
          PR_CREATE_OUTPUT=$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$CURRENT_BRANCH" \
            --title "Automated PR: ${{ github.event.head_commit.message }}" \
            --body "This PR was automatically generated by GitHub Actions. Attempting immediate merge." \
            --json number \
            2>&1 || true # Capture stderr too, and allow command to 'fail' gracefully if PR exists
          )

          # Check if a new PR number was captured, or if an existing one is open
          if echo "$PR_CREATE_OUTPUT" | jq -e '.[0].number' >/dev/null 2>&1; then
              PR_NUMBER=$(echo "$PR_CREATE_OUTPUT" | jq -r '.[0].number')
              echo "Successfully created new pull request: #$PR_NUMBER"
          else
              # If PR creation failed, assume it might already exist.
              # Find the existing open PR (if any)
              EXISTING_PR_NUMBER=$(gh pr list --head "$CURRENT_BRANCH" --base "$TARGET_BRANCH" --state open --json number -q '.[0].number')
              if [ -n "$EXISTING_PR_NUMBER" ]; then
                  PR_NUMBER=$EXISTING_PR_NUMBER
                  echo "PR creation command indicated failure, but found existing open PR: #$PR_NUMBER. Proceeding to merge this one."
              else
                  echo "Failed to create PR and no existing open PR found. Error output from gh pr create: $PR_CREATE_OUTPUT"
                  exit 1 # Fail the workflow as no PR could be handled
              fi
          fi

          echo "Attempting to merge Pull Request #$PR_NUMBER immediately..."
          # This command will attempt the merge. It will fail if branch protection
          # rules (like required status checks or approvals) are not met.
          gh pr merge "$PR_NUMBER" --squash 
          
          echo "Merge command executed for Pull Request #$PR_NUMBER. Check GitHub for status."
