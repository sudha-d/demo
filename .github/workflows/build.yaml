name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for actions/checkout
      pull-requests: write # Needed to create PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install projects dependencies
        run: |
          make install

      - name: Validating code formatting
        run: |
          make check-formatting

      - name: Linting
        run: |
          make lint

      - name: Type checking
        run: |
          make type-checking

      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py
        # working-directory: ./yaml_test 

      - name: Get current branch name
        id: branch_name
        run: echo "CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # The default GitHub Actions token
        run: |
          # Define your target branch (e.g., 'main', 'develop', 'release')
          # You can make this configurable via workflow_dispatch inputs or env vars
          TARGET_BRANCH="dev-branch"

          # Get the current branch
          CURRENT_BRANCH="${{ steps.branch_name.outputs.CURRENT_BRANCH }}"

          # Check if the current branch is already the target branch or if a PR already exists
          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            echo "Current branch is the target branch, skipping PR creation."
            exit 0
          fi

          # Check if a PR already exists from CURRENT_BRANCH to TARGET_BRANCH
          EXISTING_PR=$(gh pr list --head "$CURRENT_BRANCH" --base "$TARGET_BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "A pull request from $CURRENT_BRANCH to $TARGET_BRANCH already exists: #$EXISTING_PR"
            exit 0
          fi

          # Create the pull request
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$CURRENT_BRANCH" \
            --title "feat(${CURRENT_BRANCH}): Automated PR from ${CURRENT_BRANCH}" \
            --body "This pull request was automatically generated by GitHub Actions from the \`${CURRENT_BRANCH}\` branch." \
            --draft # Optional: create as a draft PR initially
          
          echo "Successfully created a pull request from $CURRENT_BRANCH to $TARGET_BRANCH."


