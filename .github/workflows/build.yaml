name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for actions/checkout
      pull-requests: write # Needed to create PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install black flake8

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          black: true
          flake8: true

      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py
        # working-directory: ./yaml_test 
        
      - name: Get current branch name
        id: branch_name
        run: echo "CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Create and Auto-Merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.SU_GITHUB_TOKEN }} # The default GitHub Actions token
        run: |
          set -euxo pipefail # -e: exit on error, -u: unset vars, -x: verbose output, -o pipefail: catch errors in pipes

          # Define your target branch
          TARGET_BRANCH="dev-branch"

          # Get the current branch from the previous step's output
          CURRENT_BRANCH="${{ steps.branch_name.outputs.CURRENT_BRANCH }}"

          echo "Attempting to create/merge PR from $CURRENT_BRANCH to $TARGET_BRANCH"

          # 1. Check if the current branch is already the target branch
          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            echo "Current branch ($CURRENT_BRANCH) is the target branch, skipping PR creation/merge."
            exit 0
          fi

          PR_NUMBER="" # Initialize PR_NUMBER variable

          # 2. Check if a PR already exists from CURRENT_BRANCH to TARGET_BRANCH
          EXISTING_PR=$(gh pr list --head "$CURRENT_BRANCH" --base "$TARGET_BRANCH" --state open --json number -q '.[0].number' || true) # '|| true' prevents script from failing if no PR found
          
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.[0].number')
            echo "A pull request from $CURRENT_BRANCH to $TARGET_BRANCH already exists: #$PR_NUMBER"
          else
            # 3. Create the pull request
            # Remove --draft if you want it immediately "ready for review"
            echo "No existing PR found. Creating a new one..."
            PR_CREATE_OUTPUT=$(gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$CURRENT_BRANCH" \
              --title "feat(${CURRENT_BRANCH}): Automated PR from ${CURRENT_BRANCH}" \
              --body "This pull request was automatically generated by GitHub Actions from the \`${CURRENT_BRANCH}\` branch. Attempting immediate merge." \
              --json number # Request the PR number in JSON output
            )
            PR_NUMBER=$(echo "$PR_CREATE_OUTPUT" | jq -r '.[0].number') # Extract the number using jq
            echo "Successfully created a pull request: #$PR_NUMBER"
          fi

          # 4. Attempt to merge the pull request immediately
          # This command will attempt the merge. It will fail if branch protection
          # rules (like required status checks or approvals) are not met.
          echo "Attempting to merge Pull Request #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash
          
          echo "Merge command executed for Pull Request #$PR_NUMBER. Check GitHub for final status."
