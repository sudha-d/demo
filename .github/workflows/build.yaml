name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py
        # working-directory: ./yaml_test       

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated commit for PR"
          title: "Automated PR for changes in ${{ github.ref_name }}"
          body: "This PR was automatically created for changes pushed to ${{ github.ref_name }}."
          branch: ${{ github.ref_name }}  # Use the current branch
          base: dev-branch # Target branch (e.g., main or master)
          labels: automated-pr
          draft: true
