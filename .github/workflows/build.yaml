name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for actions/checkout
      pull-requests: write # Needed to create PRs
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install black flake8

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          black: true
          flake8: true

      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py  > build_file.txt
        # working-directory: ./yaml_test 
      
      - name: Upload Generated Output as Artifact
        uses: actions/upload-artifact@v4 # Using the latest recommended version
        with:
          # Using the workflow run number directly for versioning
          name: read-yaml-output-${{ github.run_number }}
          path: build_file.txt
          retention-days: 7

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v2
        with:
              server_address: smtp.gmail.com
              server_port: 465
              username: ${{ secrets.EMAIL_USERNAME }}
              password: ${{ secrets.EMAIL_PASSWORD }}
              subject: "${{ github.job }} job of ${{ github.repository }} has ${{ job.status }}"
              body: "${{ github.job }} job in workflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}"
              to: sudharshan.dp@gmail.com
              from: Your Name <${{ secrets.EMAIL_USERNAME }}>
 
      - name: Get current branch name
        id: branch_name
        run: echo "CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Create and Merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.SU_GITHUB_TOKEN }} # The default GitHub Actions token
        run: |
          # Define your target branch (e.g., 'main', 'develop', 'release')
          TARGET_BRANCH="dev-branch"

          # Get the current branch
          CURRENT_BRANCH="${{ steps.branch_name.outputs.CURRENT_BRANCH }}"

          # Check if the current branch is already the target branch
          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            echo "Current branch is the target branch, skipping PR creation."
            exit 0
          fi

          # Check if a PR already exists from CURRENT_BRANCH to TARGET_BRANCH
          EXISTING_PR=$(gh pr list --head "$CURRENT_BRANCH" --base "$TARGET_BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "A pull request from $CURRENT_BRANCH to $TARGET_BRANCH already exists: #$EXISTING_PR"
            # Attempt to merge the existing PR
            gh pr merge "$EXISTING_PR" --merge --auto
            if [ $? -eq 0 ]; then
              echo "Successfully merged existing pull request #$EXISTING_PR."
            else
              echo "Failed to merge existing pull request #$EXISTING_PR."
              exit 1
            fi
            exit 0
          fi

          # Create the pull request
          PR_NUMBER=$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$CURRENT_BRANCH" \
            --title "feat(${CURRENT_BRANCH}): Automated PR from ${CURRENT_BRANCH}" \
            --body "This pull request was automatically generated by GitHub Actions from the \`${CURRENT_BRANCH}\` branch."  | grep -oP 'pull/\K\d+')

          if [ -n "$PR_NUMBER" ]; then
            echo "Successfully created pull request #$PR_NUMBER from $CURRENT_BRANCH to $TARGET_BRANCH."
            # Automatically merge the pull request
            gh pr merge "$PR_NUMBER" --merge --auto
            if [ $? -eq 0 ]; then
              echo "Successfully merged pull request #$PR_NUMBER."
            else
              echo "Failed to merge pull request #$PR_NUMBER."
              exit 1
            fi
          else
            echo "Failed to create pull request."
            exit 1
          fi

          
