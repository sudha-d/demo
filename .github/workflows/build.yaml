name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for actions/checkout
      pull-requests: write # Needed to create PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install black flake8

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          black: true
          flake8: true

      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py
        # working-directory: ./yaml_test 
        
      - name: Get current branch name
        id: branch_name
        run: echo "CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.SU_GITHUB_TOKEN }} # The default GitHub Actions token
        run: |
         TARGET_BRANCH="dev-branch"
         CURRENT_BRANCH="${{ steps.branch_name.outputs.CURRENT_BRANCH }}"

          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            echo "Current branch is the target branch, skipping PR creation."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --head "$CURRENT_BRANCH" --base "$TARGET_BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "A pull request from $CURRENT_BRANCH to $TARGET_BRANCH already exists: #$EXISTING_PR"
            exit 0
          fi

          PR_URL=$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$CURRENT_BRANCH" \
            --title "feat(${CURRENT_BRANCH}): Automated PR from ${CURRENT_BRANCH}" \
            --body "This pull request was automatically generated by GitHub Actions from the \`${CURRENT_BRANCH}\` branch." \
            --json url -q '.url')

         echo "Pull request created: $PR_URL"

      - name: Merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.SU_GITHUB_TOKEN }} # Use a PAT if necessary
        run: |
          PR_NUMBER=$(gh pr list --head "${{ steps.branch_name.outputs.CURRENT_BRANCH }}" --base "dev-branch" --state open --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            echo "Merging pull request #$PR_NUMBER"
            gh pr merge "$PR_NUMBER" --merge 
          else
            echo "No open pull request found to merge."
          fi
