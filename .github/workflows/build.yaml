name: Build pipeline

on:
  # pull_request:
  #   branches:
  #     - feature-branch
  #     - SCRUM-1-test-commit
  push:
    branches:
      - featute-branch
      - SCRUM-1-test-commit

jobs:
  build-pipeline:
    name: Build code
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for actions/checkout
      pull-requests: write # Needed to create PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install black flake8

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          black: true
          flake8: true

      - name: Install the dependencies
        run: |
         python -m pip install --upgrade pip # Upgrade pip itself
         pip install pyyaml                   # Install the pyyaml library
      
      - name: Build test file
        run: |
         python read_yaml.py
        # working-directory: ./yaml_test 

      - name: Setup GitHub CLI
        uses: cli/gh-cli@v2 
        
      - name: Get current branch name
        id: branch_name
        run: echo "CURRENT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Create and Auto-Merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="dev-branch"
          CURRENT_BRANCH="${{ steps.branch_name.outputs.CURRENT_BRANCH }}"

          echo "Attempting to create/merge PR from $CURRENT_BRANCH to $TARGET_BRANCH"

          if [ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]; then
            echo "Current branch ($CURRENT_BRANCH) is the same as the target branch ($TARGET_BRANCH). Skipping PR creation/merge."
            exit 0
          fi

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$CURRENT_BRANCH" \
            --title "Automated PR: ${{ github.event.head_commit.message }}" \
            --body "This PR was automatically created and is set to auto-merge when checks pass.
            Original commit message: ${{ github.event.head_commit.message }}" \
            --auto \
            --squash \
            --delete-branch \
            || {
              echo "PR creation command failed (possibly due to existing PR or other issue). Check logs."
            }

          echo "PR creation command executed. If successful, PR is set to auto-merge when checks pass."
          echo "Check your GitHub repository's 'Pull requests' tab for status."


